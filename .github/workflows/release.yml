name: Release

on:
  push:
    tags:
      - "turbobench-cli-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to validate without publishing
        required: false
        default: main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install media dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#turbobench-cli-v}"
            test "${tag_version}" = "${version}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install locked environment
        run: uv sync --frozen --group dev --python "${PYTHON_VERSION}"

      - name: Validate release metadata
        run: >-
          uv run --frozen python
          .codex/skills/build-release/scripts/release_build.py
          check-version --version "${{ steps.version.outputs.version }}"

      - name: Check PyPI version is unused
        if: github.event_name == 'push'
        run: >-
          uv run --frozen python
          .codex/skills/build-release/scripts/release_build.py
          check-pypi --version "${{ steps.version.outputs.version }}"

      - name: Run source checks
        run: |
          uv run --frozen ruff check .
          uv run --frozen pytest -m "not acceptance"

      - name: Build and audit distributions
        run: >-
          uv run --frozen python
          .codex/skills/build-release/scripts/release_build.py
          build --version "${{ steps.version.outputs.version }}"
          --out-dir "dist/release-v${{ steps.version.outputs.version }}"

      - name: Upload audited distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-v${{ steps.version.outputs.version }}
          path: dist/release-v${{ steps.version.outputs.version }}/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/turbobench-cli
    permissions:
      id-token: write
    steps:
      - name: Download audited distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-v${{ needs.build.outputs.version }}
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist

  github-release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs:
      - build
      - publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download audited distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-v${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
