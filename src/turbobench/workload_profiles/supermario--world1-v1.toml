shapes = [1, 4]
steps = 4096
quick_shapes = [4]
quick_steps = 32
seed = 123
snapshot_prefix_steps = 128
snapshot_suffix_steps = 128

[promo]
kind = "mario-imported-v1"
steps = 1986
completion_json = '{"keys":["levelHi","levelLo"],"kind":"info-change","step":1986}'

[exact]
native_transition_exact = true
